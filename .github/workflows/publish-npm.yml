# Publishes the package to npm, started by hand from the Actions tab: a release does not start it (the owner's decision of 2026-11-15: releases are
# published by hand with two-factor authentication; this file stays in the repository as a button the owner may use). Files only: nothing here has
# been run. PUBLISHING.md, "The two workflows", says what it needs and why a run makes little sense today.
name: Publish to npm by hand

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish: it must be the version in package.json, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: The version asked for must be the version in package.json
        env:
          WANTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$(node -p "require('./package.json').version")" != "${WANTED_VERSION#v}" ]; then
            echo "The version $WANTED_VERSION is not the version in package.json"
            exit 1
          fi

      - name: Run the tests that need nothing but this repository
        run: npm install && npm test

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
